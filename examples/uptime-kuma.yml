apiVersion: obacht.dev/v2
kind: Template

metadata:
  name: uptime-kuma
  displayName: Uptime Kuma
  description: |
    Self-hosted status & uptime monitoring (louislam/uptime-kuma). Runs as a
    single container with a persistent volume for its embedded SQLite DB —
    no external services needed. Bind a domain to it and you have a public
    status page in two clicks.

    Data persists at `/var/lib/obacht/uptime-kuma/<instance>/data` on the
    device; remove the instance and that directory will be left behind so
    you can re-attach without losing history.
  version: "1.0.0"
  author: obacht
  license: MIT
  homepage: https://github.com/louislam/uptime-kuma
  icon: activity
  tags:
    - monitoring
    - status-page
    - self-hosted
  trustLevel: official

spec:
  minAgentVersion: "0.1.3"

  runtime:
    type: container
    container:
      # `1` is a multi-arch tag covering amd64/arm64/arm/v7.
      image: louislam/uptime-kuma:1
      env:
        # Bind to the container port Caddy will route to.
        UPTIME_KUMA_PORT: "3001"
      volumes:
        - source: /var/lib/obacht/uptime-kuma/${instance.id}/data
          target: /app/data
      network: obacht-edge
      labels:
        obacht.template: uptime-kuma

  services:
    - name: web
      targetType: container_port
      targetPort: 3001
